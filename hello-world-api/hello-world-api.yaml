openapi: 3.0.0
info:
  title: hello-world-api
  version: 1.0.0
paths:
  /greeting:
    get:
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name to greet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello, World!"